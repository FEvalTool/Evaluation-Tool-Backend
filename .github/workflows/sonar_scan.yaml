name: "sonar_scan"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar_scan:
   runs-on: ubuntu-latest
   services:
      mysql:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: admin@123
          POSTGRES_DB: evaluation_tool
        ports: ['5432:5432']
      redis:
        image: redis:8.2.3-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
   steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.14
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unit test
      run: |
        cd project
        coverage run --source='.' manage.py test --settings=settings.settings.tests
        coverage xml
      env: 
        POSTGRES_USER: root
        POSTGRES_PASSWORD: admin@123
        POSTGRES_DB: evaluation_tool
        POSTGRES_HOST: 127.0.0.1
        POSTGRES_PORT: 5432
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379
        GARAGE_BUCKET_PUBLIC: public
        GARAGE_BUCKET_AUTH: auth
    - name: Run SonarCloud Scanner
      uses: SonarSource/sonarqube-scan-action@v4.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}